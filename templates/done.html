<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12482E">
  <title>Your QR code is ready</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="hero compact">
    <h1>Your QR code is ready</h1>
    <p>{{ name }}</p>
  </header>
  <main class="sheet pad center">
    <img class="qr" src="{{ url_for('qr_code', slug=slug) }}" alt="QR code for {{ name }}">
    <p class="url">{{ page_url }}</p>
    <a class="btn" href="{{ url_for('qr_code', slug=slug, download=1) }}">Download QR code</a>
    <button class="btn ghost" type="button" id="copy" data-url="{{ page_url }}">Copy page link</button>
    <a class="btn ghost" href="{{ url_for('business_page', slug=slug) }}">Open my page</a>
  </main>

  <script>
    document.getElementById("copy").addEventListener("click", function () {
      var b = this;
      navigator.clipboard.writeText(b.dataset.url).then(function () {
        b.textContent = "Link copied";
        setTimeout(function () { b.textContent = "Copy page link"; }, 2000);
      });
    });
  </script>
</body>
</html>
