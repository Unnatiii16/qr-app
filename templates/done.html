<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your QR code</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; padding: 40px 20px; }
    img { width: 260px; height: 260px; background: #fff; padding: 12px; border-radius: 12px; }
    a.btn { display: block; max-width: 320px; margin: 12px auto; padding: 14px; background: #222; color: #fff; text-decoration: none; border-radius: 8px; }
    a.btn.light { background: #fff; color: #222; border: 1px solid #ccc; }
    p { color: #555; word-break: break-all; }
  </style>
</head>
<body>
  <h1>{{ name }} is live!</h1>
  <img src="{{ url_for('qr_code', slug=slug) }}" alt="QR code">
  <p>{{ page_url }}</p>
  <a class="btn" href="{{ url_for('qr_code', slug=slug, download=1) }}">Download QR code</a>
  <a class="btn light" href="{{ url_for('business_page', slug=slug) }}">View my page</a>
</body>
</html>
