<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12482E">
  <title>Make your QR page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="hero compact">
    <h1>Make your QR page</h1>
    <p>Add the links you have. Skip the rest.</p>
  </header>
  <main class="sheet pad">
    <form method="POST">
      <label>Business name (required)
        <input name="name" required autocomplete="off">
      </label>

      {% for group, items in groups.items() %}
      <details {% if loop.first %}open{% endif %}>
        <summary><span>{{ group }}</span><span class="count"></span></summary>
        {% for p in items %}
        <label>{{ p.label }}
          <input name="{{ p.key }}" placeholder="{{ p.ph }}" autocomplete="off"
            {% if p.kind == 'email' %}type="email"{% endif %}
            {% if p.kind == 'wa' %}inputmode="numeric" pattern="[0-9+ ]{10,20}" title="Enter the full number with country code, digits only"{% endif %}>
        </label>
        {% endfor %}
      </details>
      {% endfor %}

      <button class="btn" type="submit">Create my QR code</button>
    </form>
  </main>

  <script>
    document.querySelectorAll("details").forEach(function (d) {
      var badge = d.querySelector(".count");
      function update() {
        var n = 0;
        d.querySelectorAll("input").forEach(function (i) { if (i.value.trim()) n++; });
        badge.textContent = n ? n + " added" : "";
      }
      d.addEventListener("input", update);
      update();
    });
    document.querySelector("form").addEventListener("invalid", function (e) {
      var d = e.target.closest("details");
      if (d) d.open = true;
    }, true);
  </script>
</body>
</html>
